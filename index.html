<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(사)안양시학원연합회</title>
<meta name="description" content="1976년 창립한 사단법인 안양시학원연합회. 학원 설립·운영자 연수, 법정의무교육, 학원자율정화, AMC 안양시 수학경시대회를 운영합니다.">
<meta property="og:title" content="(사)안양시학원연합회">
<meta property="og:description" content="안양 학원인의 권익을 위해 1976년부터 함께합니다.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">

<main id="main">

  <section class="main-visual" aria-roledescription="carousel" aria-label="연합회 소개 사진">
    <div id="slides"></div>
    <div class="mv-dots" id="dots"></div>
  </section>

  <section class="main-gallery" aria-labelledby="mg-title">
    <div class="wrap">
      <div class="mg-head">
        <p class="mg-pre">학원교육의 건전한 발전과 새로운 가치 실현</p>
        <h2 class="mg-title" id="mg-title">안양시학원연합회 <em>행사갤러리</em></h2>
        <p class="mg-desc">안양시학원연합회 총회, 연수, 봉사, 행사, 뉴스 등 다양한 활동이 담긴 회원 사진첩입니다.</p>
      </div>
      <div class="carousel">
        <button class="carousel-btn prev" type="button" aria-label="이전 사진">&lt;</button>
        <ul class="carousel-track" id="gallery"></ul>
        <button class="carousel-btn next" type="button" aria-label="다음 사진">&gt;</button>
      </div>
    </div>
  </section>

  <section class="main-band">
    <div class="wrap band-cols">
      <div>
        <div class="band-head"><h2>공지사항</h2><a class="more" href="notice.html">more +</a></div>
        <ul class="home-list" id="latest-notice"></ul>
      </div>
      <div>
        <div class="band-head"><h2>AMC 경시대회</h2><a class="more" href="amc.html">more +</a></div>
        <ul class="quick">
          <li><a href="amc.html">시험당일 주의사항</a></li>
          <li><a href="amc-ticket.html">접수확인/수험표출력</a></li>
          <li><a href="amc-score.html">성적조회</a></li>
          <li><a href="amc-past.html">기출문제</a></li>
          <li><a href="amc-centers.html">지정 접수처 학원</a></li>
        </ul>
      </div>
    </div>
  </section>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
  (function () {
    var e = AAOH.esc;
    /* 큰 사진 */
    var slides = (SITE.slides || []).filter(Boolean);
    var box = document.getElementById("slides"), dots = document.getElementById("dots");
    box.innerHTML = slides.map(function (s, i) {
      var H = i === 0 ? "h1" : "h2";
      return '<div class="mv-slide' + (i === 0 ? ' is-on' : '') + (s.image ? ' has-image" style="background-image:url(\'' + e(s.image) + '\')' : '') + '"' + (i ? ' aria-hidden="true"' : '') + '>' +
        '<div class="wrap mv-text"><' + H + '>' + e(s.title) + '</' + H + '><p>' + e(s.text) + '</p></div></div>';
    }).join("");
    box.insertAdjacentHTML("afterend", AAOH.sideBanner());
    var cur = 0, timer;
    function go(n) {
      var els = box.children;
      els[cur].classList.remove("is-on"); els[cur].setAttribute("aria-hidden", "true");
      dots.children[cur].removeAttribute("aria-current");
      cur = (n + els.length) % els.length;
      els[cur].classList.add("is-on"); els[cur].removeAttribute("aria-hidden");
      dots.children[cur].setAttribute("aria-current", "true");
    }
    if (slides.length > 1) {
      dots.innerHTML = slides.map(function (s, i) {
        return '<button type="button" aria-label="' + (i + 1) + '번째 사진"' + (i === 0 ? ' aria-current="true"' : '') + '></button>';
      }).join("");
      Array.prototype.forEach.call(dots.children, function (b, i) {
        b.addEventListener("click", function () { go(i); clearInterval(timer); });
      });
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(function () { go(cur + 1); }, 5000);
    }

    /* 행사갤러리 */
    var posts = BOARDS.events.posts.slice().sort(function (a, b) { return b.date.localeCompare(a.date) || b.id - a.id; }).slice(0, 10);
    var track = document.getElementById("gallery");
    track.innerHTML = posts.map(function (p) {
      var d = p.date.split("-");
      var thumb = p.thumb
        ? '<img src="' + e(p.thumb) + '" alt="" loading="lazy">'
        : '<span class="plate" aria-hidden="true"><span class="plate-y">' + d[0] + '</span><span class="plate-md">' + Number(d[1]) + '.' + Number(d[2]) + '</span></span>';
      return '<li><a href="post.html?b=events&id=' + p.id + '"><span class="gallery-thumb">' + thumb + '</span>' +
        '<span class="gallery-title">' + e(p.title) + '</span><time datetime="' + p.date + '">' + p.date + '</time></a></li>';
    }).join("");
    function step(dir) { var li = track.firstElementChild; track.scrollLeft += dir * (li ? li.offsetWidth + 3 : 150); }
    document.querySelector(".carousel-btn.prev").addEventListener("click", function () { step(-1); });
    document.querySelector(".carousel-btn.next").addEventListener("click", function () { step(1); });

    AAOH.renderLatest("notice", "#latest-notice", 6);
  })();
</script>
</body>
</html>
