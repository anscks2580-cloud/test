<style>
/* ==========================================================================
   INDEX 전용 — 스크롤 없는 한 화면 (로고 + 햄버거)
   ========================================================================== */
html, body { height: 100%; overflow: hidden; }

.hero {
  position: relative;
  height: 100vh;
  height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--header-h) var(--gutter);
  background: var(--paper);
  text-align: center;
}
.hero-inner { display: flex; flex-direction: column; align-items: center; }

/* 은방울꽃 심볼 (투명 PNG) */
.hero-symbol {
  display: block;
  height: clamp(180px, 31vh, 290px);
  width: auto;
  margin-bottom: clamp(18px, 3vh, 30px);
  /* 가운데 정렬 미세 조정: 음수 = 왼쪽, 양수 = 오른쪽 (예: -6px) */
  translate: var(--symbol-shift, 0px) 0;
  user-select: none;
  -webkit-user-drag: none;
}

.hero-mark {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(34px, 4vw, 58px);
  line-height: 1;
  letter-spacing: 0.2em;
  padding-left: 0.2em;           /* 자간 우측 여백 보정 → 시각적 중앙 정렬 */
  color: var(--ink);
  display: flex;
}
.hero-mark span { display: inline-block; }

.hero-rule {
  display: block;
  width: 1px;
  height: clamp(26px, 4vh, 40px);
  margin: clamp(22px, 3.6vh, 34px) 0 clamp(18px, 2.6vh, 24px);
  background: var(--ink);
  transform-origin: top;
}
.hero-name {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(15px, 1.2vw, 17px);
  line-height: 1.3;
  letter-spacing: 0.08em;
  color: var(--ink);
}
.hero-ko {
  margin-top: 10px;
  font-size: 10.5px;
  letter-spacing: 0.28em;
  padding-left: 0.28em;
  color: var(--accent);
}

/* 하단: 사업자 정보만 아주 작게 */
.hero-foot {
  position: absolute;
  left: var(--gutter);
  right: var(--gutter);
  bottom: clamp(20px, 3.5vh, 32px);
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px 20px;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--accent);
}

/* 페이지 로드 연출: 글자가 넓은 자간에서 제자리로 모이며 나타남 */
.js .hero-mark span {
  opacity: 0;
  transform: translateY(0.12em);
  transition: opacity 1.4s ease, transform 1.6s var(--ease-out);
}
.js .hero-mark { letter-spacing: 0.38em; padding-left: 0.38em; transition: letter-spacing 2.2s var(--ease-out), padding-left 2.2s var(--ease-out); }
.js .hero-rule { transform: scaleY(0); transition: transform 1.1s var(--ease) 0.9s; }
.js .hero-symbol { opacity: 0; transform: translateY(8px); transition: opacity 1.6s ease, transform 1.8s var(--ease-out); }
.js .hero-name,
.js .hero-ko,
.js .hero-foot { opacity: 0; transition: opacity 1.2s ease; }

.is-ready .hero-symbol { opacity: 1; transform: none; }
.is-ready .hero-mark { letter-spacing: 0.2em; padding-left: 0.2em; }
.is-ready .hero-mark span { opacity: 1; transform: none; transition-delay: 0.35s; }
.is-ready .hero-mark span:nth-child(2) { transition-delay: 0.45s; }
.is-ready .hero-mark span:nth-child(3) { transition-delay: 0.55s; }
.is-ready .hero-mark span:nth-child(4) { transition-delay: 0.65s; }
.is-ready .hero-rule { transform: scaleY(1); }
.is-ready .hero-name { opacity: 1; transition-delay: 1.5s; }
.is-ready .hero-ko   { opacity: 1; transition-delay: 1.7s; }
.is-ready .hero-foot { opacity: 1; transition-delay: 2.0s; }

@media (max-width: 640px) {
  .hero-mark { font-size: 32px; }
  .hero-symbol { height: 200px; margin-bottom: 18px; }
  .hero-foot { flex-direction: column; align-items: flex-start; gap: 2px; }
}
</style>
