<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMC 지정 접수처 | 안양시학원연합회</title>
<meta name="description" content="AMC 안양시 수학경시대회 지정 접수처 학원 목록">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="amc-centers">

<main id="main">
  <div class="page-body">
    <div class="wrap">
      <div class="notice-box">
        <p>아래 지정 접수처 학원에서 AMC 안양시 수학경시대회를 접수할 수 있습니다. 접수 일정은 공지사항을 확인해 주세요.</p>
      </div>
      <p class="board-count" style="margin-bottom:12px">접수처 <strong id="count"></strong>곳</p>
      <ul class="centers" id="centers"></ul>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
  document.getElementById("count").textContent = AMC.centers.length;
  document.getElementById("centers").innerHTML = AMC.centers.map(function (c) {
    return "<li>" + AAOH.esc(c) + "</li>";
  }).join("");
</script>
</body>
</html>
