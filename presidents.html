<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역대회장 | 안양시학원연합회</title>
<meta name="description" content="(사)안양시학원연합회 제1대부터 현재까지 역대 회장">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="presidents">

<main id="main">
  <div class="page-body">
    <div class="wrap">
      <ul class="presidents" id="presidents"></ul>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
  var e = AAOH.esc;
  document.getElementById("presidents").innerHTML = PRESIDENTS.map(function (p) {
    var photo = p.photo
      ? '<img src="' + e(p.photo) + '" alt="' + e(p.name) + ' 회장" loading="lazy">'
      : '<span class="ph" aria-hidden="true" style="height:100%"></span>';
    return '<li class="president">' +
      '<div class="photo">' + photo + '</div>' +
      '<h2 class="head"><span class="term">' + e(p.term.replace(/·/g, ",")) + '</span>' + e(p.name) + '회장님</h2>' +
      '<ul class="info"><li>' + e(p.academy) + '</li><li>' + e(p.period) + '</li></ul></li>';
  }).join("");
</script>
</body>
</html>
