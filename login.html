<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 안양시학원연합회</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login" data-section="회원" data-title="로그인">

<main id="main">
  <div class="page-body">
    <div class="wrap" style="max-width:460px">
      <section class="lookup-card">
        <h2>회원 로그인</h2>
        <p class="hint">정회원 전용 게시판과 협력업체 혜택은 로그인 후 볼 수 있습니다.</p>
        <form class="form" id="login-form" style="margin-top:24px" novalidate>
          <div class="form-row">
            <label for="uid">아이디</label>
            <input class="input" id="uid" name="uid" autocomplete="username" required>
          </div>
          <div class="form-row">
            <label for="pw">비밀번호</label>
            <input class="input" id="pw" name="pw" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-navy" type="submit">로그인</button>
        </form>
        <div class="alert" id="login-msg" role="status" aria-live="polite" hidden></div>
        <p class="hint" style="margin-top:24px">아직 정회원이 아니라면 <a href="join.html"><strong>정회원 입회 신청</strong></a>을 해 주세요.</p>
      </section>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
  /* 회원 시스템(Firebase Auth 등)을 연결하면 이 부분을 교체합니다 */
  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = document.getElementById("login-msg");
    msg.hidden = false;
    msg.innerHTML = "새 홈페이지의 회원 로그인은 기존 회원 정보를 옮긴 뒤 열립니다. 정회원 자료가 필요하면 사무국(" +
      '<a href="tel:' + SITE.tel.replace(/[^0-9]/g, "") + '">' + AAOH.esc(SITE.tel) + "</a>)으로 문의해 주세요.";
  });
</script>
</body>
</html>
