<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 | 안양시학원연합회</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="register" data-section="회원" data-title="회원가입">

<main id="main">
  <div class="page-body">
    <div class="wrap" style="max-width:640px">
      <section class="lookup-card" aria-labelledby="rg-title">
        <h2 id="rg-title">약관 동의</h2>
        <p class="hint">회원가입 약관과 개인정보 수집·이용 안내를 읽고 동의해 주세요.</p>

        <form class="form" id="agree-form" style="margin-top:24px" novalidate>
          <label class="check"><input type="checkbox" id="agree-all"> 회원가입 약관에 모두 동의합니다</label>
          <div class="consent">
            <label class="check"><input type="checkbox" class="agree-item" required> 회원가입약관 동의 (필수)</label>
            <p style="margin:6px 0 0 30px"><a href="terms.html" target="_blank" rel="noopener"><strong>이용약관 보기</strong></a></p>
          </div>
          <div class="consent">
            <label class="check"><input type="checkbox" class="agree-item" required> 개인정보 수집 및 이용 동의 (필수)</label>
            <p style="margin:6px 0 0 30px"><a href="privacy.html" target="_blank" rel="noopener"><strong>개인정보처리방침 보기</strong></a></p>
          </div>
          <div class="form-actions">
            <button class="btn btn-navy" type="submit">동의 후 이용하기</button>
          </div>
        </form>
        <div class="alert" id="rg-msg" role="status" aria-live="polite" hidden></div>
      </section>
      <p class="hint" style="margin-top:20px">정회원(회비 납부 회원)이 되려면 <a href="join.html"><strong>정회원입회신청서</strong></a>를 함께 보내 주세요.</p>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
  var all = document.getElementById("agree-all");
  var items = Array.prototype.slice.call(document.querySelectorAll(".agree-item"));
  all.addEventListener("change", function () { items.forEach(function (i) { i.checked = all.checked; }); });
  items.forEach(function (i) {
    i.addEventListener("change", function () { all.checked = items.every(function (x) { return x.checked; }); });
  });
  /* 회원 시스템(Firebase Auth 등)을 연결하면 이 다음 단계에 가입 양식을 붙입니다 */
  document.getElementById("agree-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = document.getElementById("rg-msg");
    msg.hidden = false;
    if (!items.every(function (x) { return x.checked; })) {
      msg.textContent = "필수 항목 두 가지에 모두 동의해야 가입할 수 있습니다.";
      return;
    }
    msg.innerHTML = "새 홈페이지의 회원가입은 기존 회원 정보를 옮긴 뒤 열립니다. 가입이 필요하면 사무국(" +
      '<a href="tel:' + SITE.tel.replace(/[^0-9]/g, "") + '">' + AAOH.esc(SITE.tel) + "</a>)으로 문의해 주세요.";
  });
</script>
</body>
</html>
